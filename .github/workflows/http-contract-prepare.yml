name: Prepare reviewed HTTP test isolation and ALPN
on:
  push:
    branches: [codex/viper-http-migration]
permissions:
  contents: read
jobs:
  objects:
    if: github.repository == 'Kukutx/Viper' && github.ref == 'refs/heads/codex/viper-http-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Store byte-verified changes without executing application code or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, path
              p.write_text(text.replace(old, new))
          path = 'src/hbbs_http/http_client.rs'
          replace(path, '                    Ok(client_config) => {\n                        builder = builder.tls_backend_preconfigured(client_config);\n', '                    Ok(client_config) => {\n                        #[cfg(not(any(target_os = "android", target_os = "ios")))]\n                        let client_config = {\n                            let mut config = client_config;\n                            config.alpn_protocols = vec![b"http/1.1".to_vec()];\n                            config\n                        };\n                        builder = builder.tls_backend_preconfigured(client_config);\n')
          path = 'tests/http_dependency_contract.rs'
          replace(path, 'use openssl::ssl::{SslAcceptor, SslFiletype, SslMethod};', 'use openssl::ssl::{select_next_proto, AlpnError, SslAcceptor, SslFiletype, SslMethod};')
          replace(path, '        let tls = certificate.map(|name| {\n            let mut builder', '        let require_alpn = certificate == Some("alpn");\n        let tls = certificate.map(|name| {\n            let name = if require_alpn { "trusted" } else { name };\n            let mut builder')
          replace(path, '            builder.check_private_key().unwrap();\n            builder.build()', '            builder.check_private_key().unwrap();\n            if require_alpn {\n                builder.set_alpn_select_callback(|_, offered| {\n                    select_next_proto(b"\\x08http/1.1", offered).ok_or(AlpnError::ALERT_FATAL)\n                });\n            }\n            builder.build()')
          replace(path, '                    if let Ok(mut encrypted) = acceptor.accept(stream) { serve(&mut encrypted); }', '                    if let Ok(mut encrypted) = acceptor.accept(stream) {\n                        if require_alpn {\n                            assert_eq!(encrypted.ssl().selected_alpn_protocol(), Some(&b"http/1.1"[..]));\n                        }\n                        serve(&mut encrypted);\n                    }')
          with Path(path).open('a') as f:
              f.write('\n#[test]\nfn desktop_rustls_preserves_http11_alpn_for_synchronous_clients() {\n    let _isolation = Isolation::new();\n    let server = Server::new(Some("alpn"), false, ok_response());\n    let client = http_client::create_http_client(TlsType::Rustls, false);\n    assert_eq!(client.get(server.url("https")).timeout(TIMEOUT).send().unwrap().status(), 200);\n    assert_eq!(server.requests().len(), 1);\n}\n\n#[tokio::test]\nasync fn desktop_rustls_preserves_http11_alpn_for_asynchronous_clients() {\n    let _isolation = Isolation::new();\n    let server = Server::new(Some("alpn"), false, ok_response());\n    let client = http_client::create_http_client_async(TlsType::Rustls, false);\n    assert_eq!(client.get(server.url("https")).timeout(TIMEOUT).send().await.unwrap().status(), 200);\n    assert_eq!(server.requests().len(), 1);\n}\n')
          path = 'tools/native/test-http.sh'
          p = Path(path)
          text = p.read_text()
          assert text.count('--features flutter,linux-pkg-config') == 2
          p.write_text(text.replace('--features flutter,linux-pkg-config', '--features flutter,linux-pkg-config,http-contract-tests'))
          replace(path, 'env HOME="$fixture/home"', 'timeout --kill-after=5s 180s env HOME="$fixture/home"')
          path = 'tools/tests/test_http_dependencies.py'
          replace(path, '    def test_lock_has_one_current_http_client(self):', '''    def test_private_integration_target_requires_explicit_fixture_setup(self):
                  manifest = tomllib.loads((ROOT / 'Cargo.toml').read_text())
                  target = next(t for t in manifest['test'] if t['name'] == 'http_dependency_contract')
                  self.assertEqual(target['required-features'], ['http-contract-tests'])
                  self.assertEqual(manifest['features']['http-contract-tests'], [])
                  self.assertNotIn('http-contract-tests', manifest['features']['default'])
                  script = (ROOT / 'tools/native/test-http.sh').read_text()
                  self.assertEqual(script.count('--features flutter,linux-pkg-config,http-contract-tests'), 2)
                  self.assertIn('timeout --kill-after=5s 180s env HOME=', script)
          
              def test_lock_has_one_current_http_client(self):'''.replace('\n          ', '\n'))
          replace(path, "        self.assertIn('builder.tls_backend_native()', source)", "        self.assertIn('config.alpn_protocols = vec![b\"http/1.1\".to_vec()]', source)\n        self.assertIn('builder.tls_backend_native()', source)")
          expected = {'Cargo.toml': '9ee012ba19ae526c28de19792ab8183d325714c2', 'src/hbbs_http/http_client.rs': '1388dfd8d42c7daeb8a2eddf0bbcc247b004a57f', 'tests/http_dependency_contract.rs': 'bc894088fd1cfad1bd7cace9603dc4323e0b2324', 'tools/native/test-http.sh': '877da9768d3687acb7b7ef5e08d3e9ba3d681f79', 'tools/tests/test_http_dependencies.py': '75fb6f50d4b89c421b187e4cb5a497cc57dec3e1'}
          for path, sha in expected.items():
              data = Path(path).read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual == sha, (path, actual, sha)
          assert os.environ['GITHUB_REPOSITORY'] == 'Kukutx/Viper'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/viper-http-migration'
          for path, sha in expected.items():
              req = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', data=json.dumps({'content': Path(path).read_text(), 'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  assert json.load(response)['sha'] == sha
          Path('reviewed-http-contract-objects.json').write_text(json.dumps(expected, indent=2))
        shell: python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-http-contract-objects
          path: reviewed-http-contract-objects.json
          retention-days: 3
          if-no-files-found: error
