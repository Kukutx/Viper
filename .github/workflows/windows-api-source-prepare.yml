name: Store reviewed Windows source migration
on:
  push:
    branches: [codex/viper-windows-api-validation]
    paths: [.github/workflows/windows-api-source-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 655c019b63a96b7d2c0b7b19143cab601a3e79cf
          persist-credentials: false
      - name: Apply and verify exactly the reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          encoded = ''
          data = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'fa7bbf4702a911f49fb83b36a7a33ab96003e68805b280248d5da297ce8399e7'
          subprocess.run(['git', 'apply', '--check', '-'], input=data, check=True)
          subprocess.run(['git', 'apply', '-'], input=data, check=True)
          expected = {'src/platform/windows.rs': '54e92c0f7761d7ab6a0d3ef22130a2f893d997b3', 'tools/windows_native.py': '9c121c20e811fbf84e49c1f0fede929560c89f96', 'libs/portable/src/bin_reader.rs': '7a266e9dc8240ea832b0fc1346341c3bdccd6d8e'}
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == set(expected)
          root = pathlib.Path('.tools/windows-source'); root.mkdir(parents=True)
          objects = []
          for index, (name, sha) in enumerate(sorted(expected.items())):
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              filename = str(index) + '.txt'; (root / filename).write_bytes(data)
              objects.append({'path': name, 'file': filename, 'sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
          (root / 'objects.json').write_text(json.dumps(objects))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-reviewed-source-blobs
          path: .tools/windows-source/
          if-no-files-found: error
          retention-days: 3
  store:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-reviewed-source-blobs
          path: inputs
      - name: Store only the three exact reviewed blobs without executing source or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('inputs')
          objects = json.loads((root / 'objects.json').read_text())
          expected = {'src/platform/windows.rs': '54e92c0f7761d7ab6a0d3ef22130a2f893d997b3', 'tools/windows_native.py': '9c121c20e811fbf84e49c1f0fede929560c89f96', 'libs/portable/src/bin_reader.rs': '7a266e9dc8240ea832b0fc1346341c3bdccd6d8e'}
          assert {o['path']: o['sha'] for o in objects} == expected and len(objects) == 3
          for index, item in enumerate(objects):
              assert item['file'] == str(index) + '.txt'
              data = (root / item['file']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == item['sha256']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected[item['path']]
              request = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', method='POST', data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected[item['path']]
              print(item['path'], result['sha'])
          PY
