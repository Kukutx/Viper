name: Flutter migration candidate

on:
  push:
    branches: [codex/viper-foundation-modernization]
    paths: ['tools/migrations/**', '.github/workflows/flutter-migration.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: flutter-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.ref == 'refs/heads/codex/viper-foundation-modernization'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: |
          python tools/viper.py env >> "$GITHUB_ENV"
          python -m pip install -r tools/requirements-dev.txt
          mkdir -p tools/.reports
          python -m unittest discover -s tools/tests -v
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: viper-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Finalize event-stream diagnostics
        run: python tools/migrations/finalize.py
      - name: Verify locked Flutter dependency graph
        working-directory: flutter
        run: flutter pub get --enforce-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: flutter-v2-migration
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/viper-vcpkg
          key: viper-yuv-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**') }}
      - name: Set up native development libraries
        run: bash tools/native/setup-linux.sh
      - name: Generate version-checked bindings
        id: generate
        run: |
          python tools/bridge.py generate > tools/.reports/codegen.log 2>&1 || { tail -100 tools/.reports/codegen.log; exit 1; }
          tail -20 tools/.reports/codegen.log
      - name: Analyze Flutter
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python tools/migrations/analyze.py
      - name: Check Rust Flutter library
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          cargo check --locked --lib --features flutter,linux-pkg-config > tools/.reports/cargo-check.log 2>&1 || { tail -100 tools/.reports/cargo-check.log; exit 1; }
          tail -10 tools/.reports/cargo-check.log
      - name: Run all Flutter regression tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: flutter
        run: |
          flutter test --no-pub test > ../tools/.reports/flutter-tests.log 2>&1 || { tail -100 ../tools/.reports/flutter-tests.log; exit 1; }
          tail -10 ../tools/.reports/flutter-tests.log
      - name: Build real native library
        id: build
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          cargo build --locked --lib --features flutter,linux-pkg-config > tools/.reports/cargo-build.log 2>&1 || { tail -100 tools/.reports/cargo-build.log; exit 1; }
          test -f target/debug/liblibrustdesk.so
      - name: Exercise real Rust-Dart bridge
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: flutter
        env:
          VIPER_NATIVE_LIBRARY: ${{ github.workspace }}/target/debug/liblibrustdesk.so
        run: |
          flutter test --no-pub test_native/bridge_ffi_test.dart > ../tools/.reports/ffi-tests.log 2>&1 || { tail -100 ../tools/.reports/ffi-tests.log; exit 1; }
          tail -10 ../tools/.reports/ffi-tests.log
      - name: Preserve candidate objects
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/migrations/snapshot.py
      - name: Capture candidate source and diagnostics
        if: always()
        run: |
          mkdir -p tools/.reports
          git diff --stat
          git diff --binary > tools/.reports/flutter-migration.patch
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          with zipfile.ZipFile('tools/.reports/source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(paths):
                  p = pathlib.Path(path)
                  if p.is_file() and not p.is_symlink():
                      z.write(p, path)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-migration-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
