name: Flutter migration candidate

on:
  push:
    branches: [codex/viper-foundation-modernization]
    paths: ['tools/migrations/**', '.github/workflows/flutter-migration.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: flutter-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.ref == 'refs/heads/codex/viper-foundation-modernization'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: |
          python tools/viper.py env >> "$GITHUB_ENV"
          python -m pip install -r tools/requirements-dev.txt
          mkdir -p tools/.reports
          python -m unittest discover -s tools/tests -v
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: viper-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Migrate remaining public APIs
        run: python tools/migrations/public_api.py
      - name: Resolve added native file-selection dependency
        working-directory: flutter
        run: flutter pub get
      - name: Install native development tools
        run: |
          sudo apt-get update -qq > tools/.reports/apt.log 2>&1
          sudo apt-get install -y -qq clang libclang-dev ninja-build pkg-config nasm libgtk-3-dev libasound2-dev libpulse-dev libdbus-1-dev libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev libxtst-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libvpx-dev libaom-dev libopus-dev libsodium-dev >> tools/.reports/apt.log 2>&1 || { tail -80 tools/.reports/apt.log; exit 1; }
          python -m pip install "cmake==$CMAKE_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: flutter-v2-migration
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/viper-vcpkg
          key: viper-yuv-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**') }}
      - name: Build repository-pinned libyuv
        run: bash tools/migrations/native_setup.sh
      - name: Generate version-checked bindings
        id: generate
        run: |
          python tools/bridge.py generate > tools/.reports/codegen.log 2>&1 || { tail -100 tools/.reports/codegen.log; exit 1; }
          tail -20 tools/.reports/codegen.log
      - name: Analyze Flutter
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python tools/migrations/analyze.py
      - name: Check Rust Flutter library
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          cargo check --locked --lib --features flutter,linux-pkg-config > tools/.reports/cargo-check.log 2>&1 || { tail -100 tools/.reports/cargo-check.log; exit 1; }
          tail -10 tools/.reports/cargo-check.log
      - name: Run all Flutter regression tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: flutter
        run: |
          flutter test --no-pub test > ../tools/.reports/flutter-tests.log 2>&1 || { tail -140 ../tools/.reports/flutter-tests.log; exit 1; }
          tail -15 ../tools/.reports/flutter-tests.log
      - name: Preserve candidate objects
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/migrations/snapshot.py
      - name: Capture candidate source and diagnostics
        if: always()
        run: |
          mkdir -p tools/.reports
          git diff --stat
          git diff --binary > tools/.reports/flutter-migration.patch
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          with zipfile.ZipFile('tools/.reports/source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(paths):
                  p = pathlib.Path(path)
                  if p.is_file() and not p.is_symlink():
                      z.write(p, path)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-migration-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
