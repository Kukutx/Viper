name: Prepare reviewed distribution blobs
on:
  push:
    branches: [codex/viper-distribution-validation]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const out = path.join(process.env.RUNNER_TEMP, 'reviewed-distribution');
            fs.mkdirSync(out);
            const sha = bytes => crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
            const entries = [
              {owner:'rustdesk', repo:'rustdesk', source:'89abf23a68ae85d0f28cdb90d1b08ad36db9d2c8', file:'res/128x128@2x.png'},
              {owner:'rustdesk', repo:'rustdesk', source:'50cab67a3e0369ed1fd3d036f5b485f9f3ca9b76', file:'res/scalable.svg'},
              {owner:'Kukutx', repo:'Viper', source:'69fe3000718ae67e8bc3a9620e15caf280035566', file:'build.py'},
            ];
            const result = [];
            for (const entry of entries) {
              const response = await github.rest.git.getBlob({owner:entry.owner, repo:entry.repo, file_sha:entry.source});
              let bytes = Buffer.from(response.data.content, 'base64');
              if (sha(bytes) !== entry.source) throw new Error('Original Git blob mismatch');
              if (entry.file === 'build.py') {
                const text = bytes.toString('utf8');
                const start = '    content = """Package: rustdesk';
                const end = '""" % (version, get_deb_arch(), get_deb_extra_depends())';
                const a = text.indexOf(start), b = text.indexOf(end, a);
                if (a < 0 || b < a || text.indexOf(start, a + 1) !== -1) throw new Error('Control template is not unique');
                bytes = Buffer.from(text.slice(0, a) + '    content = (Path(REPO_ROOT) / "configs/linux-deb-control.in").read_text(encoding="utf-8") % (\n        version, get_deb_arch(), get_deb_extra_depends())' + text.slice(b + end.length));
                if (sha(bytes) !== '161314e41955af898a68685d39d7d4a55d3831fc') throw new Error('Reviewed build.py patch differs');
              }
              const blob = await github.rest.git.createBlob({owner:'Kukutx', repo:'Viper', content:bytes.toString('base64'), encoding:'base64'});
              if (blob.data.sha !== sha(bytes)) throw new Error('Stored Git blob mismatch');
              const dest = path.join(out, entry.file);
              fs.mkdirSync(path.dirname(dest), {recursive:true});
              fs.writeFileSync(dest, bytes);
              result.push({...entry, blob:blob.data.sha, sha256:crypto.createHash('sha256').update(bytes).digest('hex')});
            }
            fs.writeFileSync(path.join(out, 'blobs.json'), JSON.stringify(result, null, 2));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-distribution-blobs
          path: ${{ runner.temp }}/reviewed-distribution/
          if-no-files-found: error
          retention-days: 3
