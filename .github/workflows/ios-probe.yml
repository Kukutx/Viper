name: Validate iOS native migration candidate
on:
  push:
    branches: [codex/viper-ios-preparation]
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Prepare explicit lifecycle and deployment settings
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/apple_sdk.py --github-env
          mkdir -p tools/.reports
          python - <<'PY'
          from pathlib import Path
          def edit(name, old, new, count=1):
              p=Path(name); text=p.read_text()
              assert text.count(old)==count,(name,old,text.count(old))
              p.write_text(text.replace(old,new))
          edit('flutter/ios/Podfile', "platform :ios, '13.0'", "platform :ios, '15.0'")
          edit('flutter/ios/Podfile', "    target.build_configurations.each do |config|\n      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '11.0'\n    end\n", '')
          edit('flutter/ios/Runner.xcodeproj/project.pbxproj','IPHONEOS_DEPLOYMENT_TARGET = 13.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',3)
          edit('flutter/ios/Flutter/AppFrameworkInfo.plist','  <key>MinimumOSVersion</key>\n  <string>13.0</string>\n','')
          edit('flutter/ios/Runner/AppDelegate.swift','@objc class AppDelegate: FlutterAppDelegate {','@objc class AppDelegate: FlutterAppDelegate, FlutterImplicitEngineDelegate {')
          edit('flutter/ios/Runner/AppDelegate.swift','    GeneratedPluginRegistrant.register(with: self)\n','')
          edit('flutter/ios/Runner/AppDelegate.swift','    return super.application(application, didFinishLaunchingWithOptions: launchOptions)\n  }\n}', '    return super.application(application, didFinishLaunchingWithOptions: launchOptions)\n  }\n\n  func didInitializeImplicitFlutterEngine(_ engineBridge: FlutterImplicitEngineBridge) {\n    GeneratedPluginRegistrant.register(with: engineBridge.pluginRegistry)\n  }\n}')
          manifest='''
          	<key>UIApplicationSceneManifest</key>
          	<dict>
          		<key>UIApplicationSupportsMultipleScenes</key>
          		<false/>
          		<key>UISceneConfigurations</key>
          		<dict>
          			<key>UIWindowSceneSessionRoleApplication</key>
          			<array>
          				<dict>
          					<key>UISceneClassName</key>
          					<string>UIWindowScene</string>
          					<key>UISceneDelegateClassName</key>
          					<string>FlutterSceneDelegate</string>
          					<key>UISceneConfigurationName</key>
          					<string>flutter</string>
          					<key>UISceneStoryboardFile</key>
          					<string>Main</string>
          				</dict>
          			</array>
          		</dict>
          	</dict>
          '''
          edit('flutter/ios/Runner/Info.plist','<dict>\n', '<dict>\n'+manifest, 2) if False else None
          p=Path('flutter/ios/Runner/Info.plist'); text=p.read_text()
          assert 'UIApplicationSceneManifest' not in text
          p.write_text(text.replace('<dict>\n','<dict>\n'+manifest,1))
          Path('res/vcpkg-triplets/arm64-ios.cmake').write_text('set(VCPKG_TARGET_ARCHITECTURE arm64)\nset(VCPKG_CRT_LINKAGE dynamic)\nset(VCPKG_LIBRARY_LINKAGE static)\nset(VCPKG_CMAKE_SYSTEM_NAME iOS)\nset(VCPKG_OSX_DEPLOYMENT_TARGET 15.0)\nset(VCPKG_CMAKE_SYSTEM_VERSION 15.0)\n')
          PY
      - name: Restore immutable upstream image assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          roots={'AppIcon.appiconset':'cbde719c65daefdaeb2b95ade76130828b9ae772','LaunchImage.imageset':'fc352403270a2b22d030aaa76fabdce37c30c49a'}
          def get(url):
              r=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(r,timeout=30) as response: return json.load(response)
          hashes={}
          for folder,sha in roots.items():
              tree=get('https://api.github.com/repos/rustdesk/rustdesk/git/trees/'+sha)
              assert tree['sha']==sha and not tree['truncated']
              for entry in tree['tree']:
                  name=entry['path']
                  if not name.endswith('.png'): continue
                  assert '/' not in name and entry['type']=='blob' and entry['mode']=='100644' and entry['size']<1000000
                  blob=get('https://api.github.com/repos/rustdesk/rustdesk/git/blobs/'+entry['sha'])
                  data=base64.b64decode(blob['content'])
                  assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==entry['sha']
                  p=Path('flutter/ios/Runner/Assets.xcassets')/folder/name
                  assert not p.exists()
                  p.write_bytes(data); hashes[str(p)]=entry['sha']
          Path('tools/.reports/ios-resource-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true
      - name: Verify SDKs and locked dependencies
        run: |
          python tools/prepare_flutter.py
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.0
          xcrun --sdk iphoneos --show-sdk-version > tools/.reports/ios-sdk.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ios-xcode27-api15
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/viper-vcpkg-ios
          key: ios-xcode27-api15-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
      - name: Build the complete iOS native dependency profile
        run: |
          set -euo pipefail
          python -m pip install "cmake==$CMAKE_VERSION"
          brew install nasm pkg-config autoconf automake libtool > tools/.reports/ios-prerequisites.log 2>&1
          export VCPKG_ROOT="$RUNNER_TEMP/viper-vcpkg-ios"
          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/.cache/viper-vcpkg-ios"
          mkdir -p "$VCPKG_ROOT" "$VCPKG_DEFAULT_BINARY_CACHE"
          git -C "$VCPKG_ROOT" init -q
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT_ID"
          git -C "$VCPKG_ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT_ID"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics > tools/.reports/ios-vcpkg-bootstrap.log 2>&1
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed" > tools/.reports/ios-vcpkg.log 2>&1 || { tail -120 tools/.reports/ios-vcpkg.log; exit 1; }
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
      - name: Compile the actual Rust static library
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --release --target aarch64-apple-ios --lib --features flutter,hwcodec > tools/.reports/ios-cargo.log 2>&1 || { tail -150 tools/.reports/ios-cargo.log; exit 1; }
          test -s target/aarch64-apple-ios/release/liblibrustdesk.a
          lipo -info target/aarch64-apple-ios/release/liblibrustdesk.a > tools/.reports/ios-archive.txt
      - name: Build the unsigned iOS application
        working-directory: flutter
        run: |
          flutter build ios --release --no-codesign --no-pub > ../tools/.reports/ios-flutter.log 2>&1 || { tail -180 ../tools/.reports/ios-flutter.log; exit 1; }
          test -s build/ios/iphoneos/Runner.app/Runner
          plutil -p build/ios/iphoneos/Runner.app/Info.plist > ../tools/.reports/ios-built-info.txt
          (cd ios && pod install --deployment) > ../tools/.reports/ios-pods-deployment.log 2>&1 || { tail -100 ../tools/.reports/ios-pods-deployment.log; exit 1; }
      - name: Capture native migration evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          out=Path('tools/.reports'); out.mkdir(parents=True,exist_ok=True)
          (out/'ios-revision.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (out/'ios-changes.patch').write_bytes(subprocess.check_output(['git','diff','--binary','--','flutter/ios','res/vcpkg-triplets/arm64-ios.cmake']))
          names=['flutter/ios/Podfile','flutter/ios/Podfile.lock','flutter/ios/Runner/AppDelegate.swift','flutter/ios/Runner/Info.plist','flutter/ios/Flutter/AppFrameworkInfo.plist','flutter/ios/Runner.xcodeproj/project.pbxproj','flutter/ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme','res/vcpkg-triplets/arm64-ios.cmake']
          names += [str(p) for p in Path('flutter/ios/Runner/Assets.xcassets').rglob('*.png')]
          with zipfile.ZipFile(out/'ios-native-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=Path(name)
                  if p.is_file() and not p.is_symlink(): archive.write(p,name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-candidate-diagnostics
          path: tools/.reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
