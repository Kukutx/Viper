name: Validate iOS network dependency modernization
on:
  push:
    branches: [codex/viper-ios-preparation]
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: Kukutx/Viper
          run-id: 36769756901
          artifact-ids: 11123741769
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ios-reviewed
          merge-multiple: true
      - name: Apply reviewed iOS source and modern interface enumeration
        env:
          REVIEWED_DIR: ${{ runner.temp }}/ios-reviewed
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          file=Path(os.environ['REVIEWED_DIR'])/'ios-native-source.zip'
          assert hashlib.sha256(file.read_bytes()).hexdigest()=='2dc77ff0db6337df929556709efd3c84dd6cec6f60302473c0364ef6618ef947'
          with zipfile.ZipFile(file) as z:
              assert len(z.namelist())==30 and len(set(z.namelist()))==30
              for item in z.infolist():
                  path=PurePosixPath(item.filename)
                  assert '..' not in path.parts and not path.is_absolute() and item.file_size<500000
                  assert item.filename.startswith('flutter/ios/') or item.filename in ['res/vcpkg-triplets/arm64-ios.cmake','libs/scrap/build.rs','configs/toolchain.json','tools/verify_ios_bundle.py']
                  dest=Path(item.filename)
                  assert not dest.is_symlink()
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          for name in ['Podfile','Podfile.lock']:
              Path('flutter/ios',name).unlink()
          PY
          python .migration/network-interface.py
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/apple_sdk.py --github-env
          mkdir -p tools/.reports
          cp "$REVIEWED_DIR/ios-resource-hashes.json" tools/.reports/
          cp Cargo.lock tools/.reports/Cargo.before.lock
          cargo metadata --format-version 1 > tools/.reports/cargo-metadata.json
          python - <<'PY'
          import json,tomllib
          from pathlib import Path
          before=tomllib.loads(Path('tools/.reports/Cargo.before.lock').read_text())['package']
          after=tomllib.loads(Path('Cargo.lock').read_text())['package']
          key=lambda x:(x['name'],x['version'],x.get('source',''))
          a={key(p) for p in before};b={key(p) for p in after}
          assert ('netdev','0.46.3','registry+https://github.com/rust-lang/crates.io-index') in b
          assert not any(p[0] in ('default-net','system-configuration','system-configuration-sys') for p in b)
          Path('tools/.reports/network-lock-change.json').write_text(json.dumps({'removed':sorted(a-b),'added':sorted(b-a)},indent=2)+'\n')
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true
      - name: Verify SDKs and locked dependencies
        run: |
          python tools/prepare_flutter.py
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.0
          xcrun --sdk iphoneos --show-sdk-version > tools/.reports/ios-sdk.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: ios-xcode27-api15
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: native-cache
        with:
          path: ~/.cache/viper-vcpkg-ios
          key: ios-xcode27-api15-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
      - name: Build the complete iOS native dependency profile
        run: |
          set -euo pipefail
          python -m pip install "cmake==$CMAKE_VERSION"
          brew install nasm pkg-config autoconf automake libtool > tools/.reports/ios-prerequisites.log 2>&1
          export VCPKG_ROOT="$RUNNER_TEMP/viper-vcpkg-ios"
          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/.cache/viper-vcpkg-ios"
          mkdir -p "$VCPKG_ROOT" "$VCPKG_DEFAULT_BINARY_CACHE"
          git -C "$VCPKG_ROOT" init -q
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT_ID"
          git -C "$VCPKG_ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "$VCPKG_COMMIT_ID"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics > tools/.reports/ios-vcpkg-bootstrap.log 2>&1
          env -u IPHONEOS_DEPLOYMENT_TARGET "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed" > tools/.reports/ios-vcpkg.log 2>&1 || { tail -120 tools/.reports/ios-vcpkg.log; exit 1; }
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/viper-vcpkg-ios
          key: ios-xcode27-api15-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
      - name: Compile the actual Rust static library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --release --target aarch64-apple-ios --lib --features flutter,hwcodec > tools/.reports/ios-cargo.log 2>&1 || { tail -150 tools/.reports/ios-cargo.log; exit 1; }
          test -s target/aarch64-apple-ios/release/liblibrustdesk.a
      - name: Build and inspect the unsigned iOS application
        working-directory: flutter
        env:
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: '15.0'
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
        run: |
          flutter build ios --release --no-codesign --no-pub > ../tools/.reports/ios-flutter.log 2>&1 || { tail -150 ../tools/.reports/ios-flutter.log; exit 1; }
          python ../tools/verify_ios_bundle.py build/ios/iphoneos/Runner.app ../target/aarch64-apple-ios/release/liblibrustdesk.a --report ../tools/.reports/ios-bundle.json
      - name: Capture exact reviewed source and native evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          out=Path('tools/.reports'); out.mkdir(parents=True,exist_ok=True)
          (out/'ios-revision.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (out/'ios-changes.patch').write_bytes(subprocess.check_output(['git','diff','--binary','--','flutter/ios','res/vcpkg-triplets/arm64-ios.cmake','libs/scrap/build.rs','configs/toolchain.json','Cargo.toml','Cargo.lock','src/lan.rs']))
          names=['flutter/ios/Runner/AppDelegate.swift','flutter/ios/Runner/Info.plist','flutter/ios/Flutter/AppFrameworkInfo.plist','flutter/ios/Flutter/Debug.xcconfig','flutter/ios/Flutter/Release.xcconfig','flutter/ios/Runner.xcodeproj/project.pbxproj','flutter/ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme','flutter/ios/Runner.xcworkspace/contents.xcworkspacedata','res/vcpkg-triplets/arm64-ios.cmake','libs/scrap/build.rs','configs/toolchain.json','tools/verify_ios_bundle.py','Cargo.toml','Cargo.lock','src/lan.rs']
          names += [str(p) for p in Path('flutter/ios/Runner/Assets.xcassets').rglob('*.png')]
          names += [str(p) for base in ('flutter/ios/Runner.xcodeproj','flutter/ios/Runner.xcworkspace') for p in Path(base).rglob('Package.resolved')]
          with zipfile.ZipFile(out/'ios-native-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=Path(name)
                  if p.is_file() and not p.is_symlink(): archive.write(p,name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ios-candidate-diagnostics
          path: tools/.reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
