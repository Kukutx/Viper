name: Windows native validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }} native Release and FFI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.arch }}
      - name: Read the shared toolchain
        shell: bash
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/bridge.py check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: windows-native-vs18-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build and verify the native Release bundle
        run: python tools/windows_native.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-native-${{ matrix.arch }}-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
