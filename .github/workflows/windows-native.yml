name: Windows native validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} native Release and FFI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: windows-native-${{ matrix.arch }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.arch }}
      - name: Read the shared toolchain
        shell: bash
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/bridge.py check
          mkdir -p tools/.reports .tools/vcpkg-cache
          git rev-parse HEAD > tools/.reports/revision.txt
      - name: Bootstrap the immutable native Flutter SDK
        run: python tools/install_windows_flutter.py --github-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: windows-native-vs18-${{ matrix.arch }}
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: .tools/vcpkg-cache
          key: viper-windows-native-${{ matrix.arch }}-${{ hashFiles('configs/toolchain.json', 'res/vcpkg/**') }}
      - name: Build and verify the native Release bundle
        run: python tools/windows_native.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: .tools/vcpkg-cache
          key: viper-windows-native-${{ matrix.arch }}-${{ hashFiles('configs/toolchain.json', 'res/vcpkg/**') }}
      - name: Archive the validated unsigned bundle
        run: python tools/package_windows.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-native-${{ matrix.arch }}-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-unsigned-${{ github.sha }}
          path: dist/windows-${{ matrix.arch }}-unsigned/
          retention-days: 3
          if-no-files-found: error
