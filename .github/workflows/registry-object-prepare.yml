name: Preserve reviewed registry lock candidate
on:
  push:
    branches: [codex/viper-completion-validation]
    paths: [.github/workflows/registry-object-prepare.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 11130148615
          run-id: 36787915979
          github-token: ${{ github.token }}
          path: .candidate
          merge-multiple: true
      - name: Validate the reviewed bytes and save a single blob without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, tomllib, urllib.request
          data = Path('.candidate/Cargo.lock').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '3db9d4e503edf7ed081473feffd3b014b4dd113076132a0b29b800e6a87c7f6d'
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == '1e22a74e7a5274e1b8fe03133f504376f0c7b48d'
          current = tomllib.loads(Path('Cargo.lock').read_text())['package']
          candidate = tomllib.loads(data.decode())['package']
          git = lambda ps: {(p['name'], p['version'], p['source']) for p in ps if p.get('source', '').startswith('git+')}
          assert git(current) == git(candidate)
          for name, expected in [('flutter_rust_bridge', '2.13.0'), ('netdev', '0.46.3')]:
              assert [p['version'] for p in candidate if p['name'] == name] == [expected]
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == '1e22a74e7a5274e1b8fe03133f504376f0c7b48d'
          print('Stored the reviewed lock candidate; no manifests, branches or tags were changed.')
          PY
