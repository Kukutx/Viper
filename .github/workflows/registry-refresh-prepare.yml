name: Resolve compatible registry updates
on:
  push:
    branches: [codex/viper-completion-validation]
    paths: [.github/workflows/registry-refresh-prepare.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Resolve registry versions and require unchanged Git sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, tomllib
          out = Path('tools/.reports/registry-refresh')
          out.mkdir(parents=True, exist_ok=True)
          original = Path('Cargo.lock').read_bytes()
          before = tomllib.loads(original.decode())['package']
          (out / 'before.lock').write_bytes(original)
          (out / 'revision.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          git_before = {(p['name'], p['version'], p['source']) for p in before if p.get('source', '').startswith('git+')}
          nonregistry = {(p['name'], p['version']) for p in before if not p.get('source', '').startswith('registry+')}
          targets = sorted({(p['name'], p['version']) for p in before if p.get('source', '').startswith('registry+')} - nonregistry)
          command = ['cargo', 'update']
          for name, version in targets:
              command += ['--package', name + '@' + version]
          (out / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          with (out / 'resolution.log').open('w') as log:
              status = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=600).returncode
          (out / 'Cargo.lock').write_bytes(Path('Cargo.lock').read_bytes())
          (out / 'changes.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', 'Cargo.lock']))
          if status:
              raise SystemExit(status)
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          git_after = {(p['name'], p['version'], p['source']) for p in after if p.get('source', '').startswith('git+')}
          if git_before != git_after:
              raise SystemExit('Git dependency revisions or identities changed; candidate rejected')
          subprocess.run(['cargo', 'metadata', '--locked', '--format-version', '1', '--no-deps'], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'Cargo.toml', 'libs', 'flutter/pubspec.yaml', 'flutter/pubspec.lock', 'rust-toolchain.toml'], check=True)
          old = {(p['name'], p['version'], p.get('source')) for p in before}
          new = {(p['name'], p['version'], p.get('source')) for p in after}
          report = {'note': 'Resolution candidate only; compilation and platform regression still required', 'selected_registry_entries': len(targets), 'unchanged_git_packages': len(git_before), 'added': sorted(new-old), 'removed': sorted(old-new), 'lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest()}
          (out / 'resolution.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: registry-refresh-candidate
          path: tools/.reports/registry-refresh/
          if-no-files-found: error
          retention-days: 7
