name: Flutter desktop platform tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: flutter-platform-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dart:
    name: Dart analysis and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Read the shared toolchain
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/bridge.py check
          mkdir -p tools/.reports
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: true
      - name: Verify SDK and locked dependencies
        run: |
          # Keep first-run SDK bootstrap output out of the strict JSON report.
          flutter --version > tools/.reports/flutter-bootstrap.log 2>&1 || { cat tools/.reports/flutter-bootstrap.log; exit 1; }
          flutter --version --machine > tools/.reports/flutter-version.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('configs/toolchain.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('tools/.reports/flutter-version.json').read_text(encoding='utf-8'))
          assert actual['frameworkVersion'] == expected['flutter'], actual
          assert actual['dartSdkVersion'].split()[0] == expected['dart'], actual
          PY
          (cd flutter && flutter pub get --enforce-lockfile)
          git diff --exit-code -- flutter/pubspec.yaml flutter/pubspec.lock
      - name: Analyze Flutter
        run: python tools/analyze_flutter.py
      - name: Run the complete Flutter unit-test directory
        working-directory: flutter
        run: |
          flutter test --no-pub test > ../tools/.reports/flutter-tests.log 2>&1 || { tail -100 ../tools/.reports/flutter-tests.log; exit 1; }
          tail -10 ../tools/.reports/flutter-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-platform-tests-${{ matrix.os }}-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
