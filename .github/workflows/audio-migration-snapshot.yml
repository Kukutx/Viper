name: Inspect audio migration transport
on:
  push:
    branches: [codex/viper-audio-modernization-validation]
    paths: [.github/workflows/audio-migration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export transport inputs without applying code
        run: |
          mkdir -p "$RUNNER_TEMP/transport"
          cp tools/.audio-migration.patch.b64 "$RUNNER_TEMP/transport/patch.b64"
          cp .github/workflows/audio-migration-prepare.yml "$RUNNER_TEMP/transport/prepare.yml"
          sha256sum "$RUNNER_TEMP/transport/patch.b64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-transport-inputs
          path: ${{ runner.temp }}/transport/
          retention-days: 1
          if-no-files-found: error
