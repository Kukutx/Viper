name: Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/viper.py check
      - run: python tools/bridge.py check
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/viper.py inventory
      - name: Validate workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("configs/toolchain.json"))["actionlint"])')
          archive="actionlint_${version}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "$archive"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" -o checksums.txt
          awk -v f="$archive" '$2 == f' checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum -c selected.sha256
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory-${{ github.sha }}
          path: tools/.reports/inventory.json
          if-no-files-found: error
          retention-days: 14

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install core prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev libssl-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify lockfile resolution
        run: cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Core library tests
        run: cargo test --locked -p base -p hbb_common --lib

  gate:
    name: Foundation Gate
    if: always()
    needs: [repository, core]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$CORE_RESULT" = success
