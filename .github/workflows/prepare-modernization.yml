name: Prepare modernization candidate
on:
  push:
    branches: [codex/viper-foundation-modernization]
    paths:
      - tools/prepare_modernization.py
      - configs/actions-lock.json
      - .github/workflows/prepare-modernization.yml
permissions:
  contents: write
concurrency:
  group: prepare-modernization
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'Kukutx/Viper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r tools/requirements-dev.txt
      - name: Install verified workflow linter
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("configs/toolchain.json"))["actionlint"])')
          archive="actionlint_${version}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "$archive"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" -o checksums.txt
          awk -v f="$archive" '$2 == f' checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum -c selected.sha256
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create tested Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_modernization.py
