name: Validate and export Flutter bridge

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/flutter-validate.yml

  export:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        # Every platform consumes the same committed FRB 2 outputs.
        artifact: [bridge-artifact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the complete committed bridge
        run: |
          git ls-files --error-unmatch \
            src/bridge_generated.rs \
            flutter/lib/generated/flutter_ffi.dart \
            flutter/lib/generated/flutter_ffi.freezed.dart \
            flutter/lib/generated/frb_generated.dart \
            flutter/lib/generated/frb_generated.io.dart \
            flutter/lib/generated/frb_generated.web.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            src/bridge_generated.rs
            flutter/lib/generated/*.dart
          if-no-files-found: error
          retention-days: 7
