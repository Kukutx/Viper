name: Preserve reviewed SwiftPM integration

on:
  push:
    branches: [codex/viper-native-project-preparation]
    paths: [.github/workflows/native-projects-prepare.yml]
permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Kukutx/Viper' && github.ref == 'refs/heads/codex/viper-native-project-preparation'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-native-diagnostics-15a04883d4252debf76a31f244e12d8a89ef601e
          run-id: 36656598945
          github-token: ${{ github.token }}
          path: tools/.reports/reviewed-input
      - name: Import exact reviewed data and correct native library search paths
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path('tools/.reports/reviewed-input/native-project')
          assert (source / 'revision.txt').read_text().strip() == '15a04883d4252debf76a31f244e12d8a89ef601e'
          files = {
              'project.pbxproj': ('d2a490705b6448db43e58a512890d4d73e4a59307034715ea0dce33497082a51', 'flutter/macos/Runner.xcodeproj/project.pbxproj'),
              'Runner.xcscheme': ('3f752e1a4698478beaf078a046152cb04a66cd99852133b73cdf957b38fb0d48', 'flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme'),
              'Podfile.lock': ('309a0622cd37822259781c6cb97662369e9dc592a94c34378770af2e007b6e16', 'flutter/macos/Podfile.lock'),
          }
          for name, (sha, target) in files.items():
              data = (source / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == sha, name
              text = data.decode('utf-8')
              if name == 'project.pbxproj':
                  for old in ('../../target/debug,', '../../target/profile,'):
                      assert text.count(old) == 1
                      text = text.replace(old, '../../target/release,')
              if name == 'Runner.xcscheme':
                  ET.fromstring(text)
              Path(target).write_text(text, encoding='utf-8')
          PY
          plutil -lint flutter/macos/Runner.xcodeproj/project.pbxproj
          git diff --check
          git diff -- flutter/macos/Runner.xcodeproj/project.pbxproj flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme flutter/macos/Podfile.lock > tools/.reports/swiftpm-reviewed.patch
      - name: Create reviewed blobs without moving refs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const paths = ['flutter/macos/Runner.xcodeproj/project.pbxproj', 'flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme', 'flutter/macos/Podfile.lock'];
            const objects = [];
            for (const path of paths) {
              const content = fs.readFileSync(path, 'utf8');
              const bytes = Buffer.from(content, 'utf8');
              const expected = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              const {data} = await github.rest.git.createBlob({...context.repo, content, encoding: 'utf-8'});
              if (data.sha !== expected) throw new Error(`Checksum mismatch: ${path}`);
              objects.push({path, mode: '100644', type: 'blob', sha: data.sha});
            }
            fs.writeFileSync('tools/.reports/swiftpm-reviewed.json', JSON.stringify({source: context.sha, objects}, null, 2));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-swiftpm-${{ github.sha }}
          path: |
            tools/.reports/swiftpm-reviewed.json
            tools/.reports/swiftpm-reviewed.patch
          if-no-files-found: error
          retention-days: 3
