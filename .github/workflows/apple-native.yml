name: Apple native validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headers:
    name: Generate Apple C bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          mkdir -p tools/.reports
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: viper-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: flutter-v2-migration
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/viper-vcpkg
          key: viper-yuv-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**') }}
      - run: bash tools/native/setup-linux.sh
      - name: Generate complete Rust, Dart and C bindings
        run: |
          python tools/bridge.py generate > tools/.reports/apple-codegen.log 2>&1 || { tail -100 tools/.reports/apple-codegen.log; exit 1; }
          git diff --exit-code -- Cargo.lock flutter/pubspec.yaml flutter/pubspec.lock src/bridge_generated.rs flutter/lib/generated
          test -s flutter/macos/Runner/bridge_generated.h
          test -s flutter/ios/Runner/bridge_generated.h
          cmp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-c-bindings-${{ github.sha }}
          path: |
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: apple-codegen-diagnostics-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7

  macos:
    name: macOS native library and desktop bundle
    needs: [headers]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.3'
      FLUTTER_XCODE_MACOSX_DEPLOYMENT_TARGET: '12.3'
      FLUTTER_XCODE_ARCHS: arm64
      FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'YES'
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/bridge.py check
          mkdir -p tools/.reports
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: arm64
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apple-c-bindings-${{ github.sha }}
          path: flutter
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: apple-native-v2
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/viper-vcpkg-macos
          key: viper-apple-${{ runner.arch }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**', 'tools/native/setup-macos.sh') }}
      - name: Set up pinned native dependencies
        run: bash tools/native/setup-macos.sh
      - name: Build actual macOS Rust library
        run: |
          cargo build --locked --release --lib --features flutter > tools/.reports/macos-cargo.log 2>&1 || { tail -120 tools/.reports/macos-cargo.log; exit 1; }
          test -s target/release/liblibrustdesk.dylib
          file target/release/liblibrustdesk.dylib
      - name: Build the desktop bundle without signing
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --debug --no-pub > ../tools/.reports/macos-flutter.log 2>&1 || { tail -120 ../tools/.reports/macos-flutter.log; exit 1; }
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Exercise the bundled native library
        working-directory: flutter
        env:
          VIPER_NATIVE_LIBRARY: ${{ github.workspace }}/flutter/build/macos/Build/Products/Debug/RustDesk.app/Contents/Frameworks/liblibrustdesk.dylib
        run: |
          test -s "$VIPER_NATIVE_LIBRARY"
          otool -L "$VIPER_NATIVE_LIBRARY" > ../tools/.reports/macos-linked-libraries.log
          flutter test --no-pub test_native/bridge_ffi_test.dart > ../tools/.reports/macos-ffi.log 2>&1 || { tail -100 ../tools/.reports/macos-ffi.log; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-native-diagnostics-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
