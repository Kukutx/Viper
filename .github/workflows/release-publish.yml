name: Publish staged Flutter release

on:
  workflow_call:
    inputs:
      upload-tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'Kukutx/Viper' && !startsWith(github.event_name, 'pull_request') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-staging
      - name: Verify complete staged asset set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("release-staging")
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("release staging directory is missing or linked")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("release staging contains no files")
          seen = set()
          manifest = []
          for path in files:
              if path.is_symlink():
                  raise SystemExit(f"release asset is a symlink: {path}")
              if path.name in seen:
                  raise SystemExit(f"duplicate release asset basename: {path.name}")
              seen.add(path.name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append(f"{digest}  {path.relative_to(root).as_posix()}")
          Path("release-manifest.sha256").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          print(f"Verified {len(files)} staged release assets")
          PY
      - name: Publish complete release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          tag_name: ${{ inputs.upload-tag }}
          fail_on_unmatched_files: true
          files: |
            release-staging/**/*
            release-manifest.sha256
