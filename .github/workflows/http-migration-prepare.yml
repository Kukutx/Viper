name: Prepare reviewed HTTP migration
on:
  push:
    branches: [codex/viper-http-migration]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Kukutx/Viper' && github.ref == 'refs/heads/codex/viper-http-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - run: python tools/ci_rust.py
      - name: Export immutable input and resolve only the reviewed HTTP upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/.reports/http-prepare
          git archive HEAD | gzip -n > tools/.reports/http-prepare/source.tar.gz
          git -C libs/hbb_common archive HEAD | gzip -n > tools/.reports/http-prepare/hbb-common.tar.gz
          git rev-parse HEAD > tools/.reports/http-prepare/revision.txt
          cp Cargo.lock tools/.reports/http-prepare/Cargo.before.lock
          python - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          old = 'reqwest = { version = "0.12", features = ["blocking", "socks", "json", "native-tls", "rustls-tls", "rustls-tls-native-roots", "gzip", "zstd"], default-features=false }'
          new = 'reqwest = { version = "0.13.5", features = ["blocking", "socks", "json", "query", "native-tls-no-alpn", "rustls-no-provider", "gzip", "zstd"], default-features=false }'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          cargo update --package reqwest --precise 0.13.5 > tools/.reports/http-prepare/resolve.log 2>&1 || { cat tools/.reports/http-prepare/resolve.log; exit 1; }
          cargo metadata --locked --no-deps --format-version 1 > tools/.reports/http-prepare/metadata.json
          python - <<'PY'
          from pathlib import Path
          import json, tomllib
          report = Path('tools/.reports/http-prepare')
          before = tomllib.loads((report / 'Cargo.before.lock').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          git = lambda pkgs: sorted((p['name'], p['version'], p['source']) for p in pkgs if p.get('source', '').startswith('git+'))
          assert git(before) == git(after), 'Unrelated Git fork drift'
          reqwest = [p for p in after if p['name'] == 'reqwest']
          assert len(reqwest) == 1 and reqwest[0]['version'] == '0.13.5'
          (report / 'resolution.json').write_text(json.dumps({'git_packages_preserved': len(git(after)), 'reqwest': reqwest[0]}, indent=2))
          for name in ['Cargo.lock', 'Cargo.toml']:
              (report / name).write_bytes(Path(name).read_bytes())
          PY
      - name: Store reviewed lock object only, without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'Kukutx/Viper'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/viper-http-migration'
          data = json.dumps({'content': Path('Cargo.lock').read_text(), 'encoding': 'utf-8'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          Path('tools/.reports/http-prepare/lock-blob.json').write_text(json.dumps({'sha': result['sha']}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-http-resolution
          path: tools/.reports/http-prepare/
          retention-days: 3
          if-no-files-found: error
