name: Validate exact iOS archive integration
on:
  push:
    branches: [codex/viper-completion-validation]
    paths: [.github/workflows/ios-archive-prepare.yml, .migration/ios-archive/**]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Apply only the checksum-verified archive integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, subprocess
          data = b''.join((Path('.migration/ios-archive') / str(i).zfill(3)).read_bytes() for i in range(4))
          assert hashlib.sha256(data).hexdigest() == '27fc45873737d603343617e3d11caf80ebe3878de4dbab13d808c5bb9da99bbb'
          patch = gzip.decompress(data)
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          PY
          python -m pip install -r tools/requirements-dev.txt
          mkdir -p tools/.reports
          python tools/viper.py check
          python tools/bridge.py check
          python -m unittest discover -s tools/tests -v 2>&1 | tee tools/.reports/ios-archive-tests.log
          bash -n tools/native/build-ios.sh
          git diff --check
      - name: Validate workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("configs/toolchain.json"))["actionlint"])')
          archive="actionlint_${version}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "$archive"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" -o checksums.txt
          awk -v f="$archive" '$2 == f' checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum -c selected.sha256
          tar -xzf "$archive" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Preserve only validated file objects without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'Kukutx/Viper'
          expected = {
              '.github/workflows/flutter-build.yml': 'f2f2ce5d1b5fd104fd93270623ba589860e077c5',
              '.github/workflows/ios-native.yml': '157da49317d5965a515c5342089b9716f1e6e88b',
              'tools/native/build-ios.sh': 'c0c69015f67dcce170851558064a2fe1f5fe6468',
              'tools/package_ios.py': '98b8f6db81c2ddf1132ae9f3548ac00dd4b2a8bc',
              'tools/tests/test_ios_package.py': '6e4a4b4031db8221afdccaf6dc0a1fbecfcea28f',
          }
          files = []
          for path, sha in expected.items():
              data = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha, path
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)
              assert actual['sha'] == sha, path
              files.append({'path': path, 'mode': '100755' if path.endswith('.sh') else '100644', 'type': 'blob', 'sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
          Path('tools/.reports/reviewed-ios-archive-files.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-ios-archive-integration
          path: tools/.reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
