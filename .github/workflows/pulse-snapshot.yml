name: Export pinned PulseAudio fork
on:
  push:
    branches: [codex/viper-ci-stabilization]
    paths: [.github/workflows/pulse-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rustdesk-org/pulsectl
          ref: aa34dde499aa912a3abc5289cc0b547bd07dd6e2
          persist-credentials: false
      - name: Export immutable source and object identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulse-source"
          test "$(git rev-parse HEAD)" = aa34dde499aa912a3abc5289cc0b547bd07dd6e2
          git ls-tree -r HEAD > "$RUNNER_TEMP/pulse-source/tree.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pulse-source/source.tar"
          cd "$RUNNER_TEMP/pulse-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pinned-pulsectl-source
          path: ${{ runner.temp }}/pulse-source/
          if-no-files-found: error
          retention-days: 3
