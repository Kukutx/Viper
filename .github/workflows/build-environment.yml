name: Native build environment

on:
  pull_request:
    branches: [main]
    paths: ['Dockerfile', 'entrypoint.sh', '.dockerignore', 'configs/**', '.github/workflows/build-environment.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', 'entrypoint.sh', '.dockerignore', 'configs/**', '.github/workflows/build-environment.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated builder image to GHCR (main only)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-environment-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/viper.py env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: viper-builder:test
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            VCPKG_COMMIT_ID=${{ env.VCPKG_COMMIT_ID }}
          cache-from: type=gha,scope=native-builder
          cache-to: type=gha,mode=max,scope=native-builder
      - name: Verify toolchain and non-root execution
        run: |
          docker run --rm --entrypoint sh viper-builder:test -ec 'test "$(id -u)" != 0; rustc --version; cargo --version; python --version; cmake --version; /opt/vcpkg/vcpkg version'

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: build-images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read configuration and image name
        id: image
        shell: bash
        run: |
          python3 tools/viper.py env >> "$GITHUB_ENV"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/builder" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            VCPKG_COMMIT_ID=${{ env.VCPKG_COMMIT_ID }}
          cache-from: type=gha,scope=native-builder
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Builder image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
