name: Verify core test initialization isolation
on:
  push:
    branches: [codex/viper-audio-log-verification]
permissions:
  contents: read
jobs:
  serial-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff3948814c9d8d727f55c837587f0e9a9af0b88c
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - run: python tools/ci_rust.py
      - name: Install core prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Require three complete serial core suites
        run: |
          set -euo pipefail
          git rev-parse HEAD > tools/.reports/core-revision.txt
          git submodule status --recursive > tools/.reports/core-submodules.txt
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          for attempt in 1 2 3; do
            cargo test --locked -p base -p hbb_common --lib -- --test-threads=1 > "tools/.reports/core-serial-${attempt}.log" 2>&1 || { tail -c 10000 "tools/.reports/core-serial-${attempt}.log"; exit 1; }
          done
          git diff --exit-code HEAD -- Cargo.lock Cargo.toml libs/hbb_common
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-serial-core-evidence
          path: tools/.reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
