name: Capture exact migration source
on:
  push:
    branches: [codex/viper-platform-source-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d9380680ccb9cf562ad76803984446a26f892af3
          submodules: recursive
          persist-credentials: false
      - name: Archive only tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snapshot"
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot/revision.txt"
          git ls-files -s > "$RUNNER_TEMP/snapshot/index.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/snapshot/source.tar.gz"
          git -C libs/hbb_common archive --format=tar.gz HEAD > "$RUNNER_TEMP/snapshot/hbb_common.tar.gz"
          cd "$RUNNER_TEMP/snapshot"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viper-platform-source-d938068
          path: ${{ runner.temp }}/snapshot/
          retention-days: 3
          if-no-files-found: error
