name: Flutter bridge validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: flutter-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Flutter and native bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Read toolchain and validate bridge versions
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py env >> "$GITHUB_ENV"
          python tools/bridge.py check
          mkdir -p tools/.reports
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-cache
        with:
          path: /opt/hostedtoolcache/flutter
          key: viper-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: /opt/hostedtoolcache/flutter
          key: viper-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: flutter-v2-migration
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: ~/.cache/viper-vcpkg
          key: viper-yuv-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**') }}
      - name: Set up native libraries
        run: bash tools/native/setup-linux.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/viper-vcpkg
          key: viper-yuv-${{ runner.os }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('res/vcpkg/**') }}
      - name: Verify reproducible bindings and locked dependencies
        run: |
          python tools/bridge.py generate > tools/.reports/codegen.log 2>&1 || { tail -100 tools/.reports/codegen.log; exit 1; }
          git diff --exit-code -- Cargo.lock flutter/pubspec.yaml flutter/pubspec.lock src/bridge_generated.rs flutter/lib/generated
          test -z "$(git ls-files --others -- src/bridge_generated.rs flutter/lib/generated)"
      - name: Analyze Flutter without suppressing diagnostics
        run: python tools/analyze_flutter.py
      - name: Run Flutter regression tests
        working-directory: flutter
        run: |
          flutter test --no-pub test > ../tools/.reports/flutter-tests.log 2>&1 || { tail -100 ../tools/.reports/flutter-tests.log; exit 1; }
          tail -10 ../tools/.reports/flutter-tests.log
      - name: Check and build the native Flutter library
        run: |
          cargo check --locked --lib --features flutter,linux-pkg-config > tools/.reports/cargo-check.log 2>&1 || { tail -100 tools/.reports/cargo-check.log; exit 1; }
          cargo build --locked --lib --features flutter,linux-pkg-config > tools/.reports/cargo-build.log 2>&1 || { tail -100 tools/.reports/cargo-build.log; exit 1; }
          test -f target/debug/liblibrustdesk.so
      - name: Exercise actual synchronous and asynchronous FFI
        working-directory: flutter
        env:
          VIPER_NATIVE_LIBRARY: ${{ github.workspace }}/target/debug/liblibrustdesk.so
        run: |
          flutter test --no-pub test_native/bridge_ffi_test.dart > ../tools/.reports/ffi-tests.log 2>&1 || { tail -100 ../tools/.reports/ffi-tests.log; exit 1; }
          tail -10 ../tools/.reports/ffi-tests.log
      - name: Build and validate the Linux desktop bundle
        run: bash tools/native/build-linux-bundle.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flutter-validation-${{ github.sha }}
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
