name: Snapshot Android migration baseline
on:
  push:
    branches: [codex/viper-android-preparation]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0dc32f1b7a924104ff3f03a1aba335c1e9386f82
          submodules: recursive
          persist-credentials: false
      - name: Export only committed source
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/snapshot/source.tar.gz"
          git -C libs/hbb_common archive --format=tar.gz HEAD > "$RUNNER_TEMP/snapshot/hbb_common.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/snapshot/tree.txt"
          cd "$RUNNER_TEMP/snapshot"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-migration-source
          path: ${{ runner.temp }}/snapshot/
          if-no-files-found: error
          retention-days: 1
