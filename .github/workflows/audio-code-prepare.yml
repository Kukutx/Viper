name: Store exact reviewed audio source objects
on:
  push:
    branches: [codex/viper-audio-dependency-validation]
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const edits = {
              'src/client.rs': {before:'ca4c87470a08da21839f994c9af18acd3c752049', after:'5f2bd6b935773365fb5fda28ec3edde66936a047', edits:[
                ['use ringbuf::{ring_buffer::RbBase, Rb};','use ringbuf::traits::{Consumer, Observer, RingBuffer};',1],
                ['let old_capacity = self.0.lock().unwrap().capacity();','let old_capacity = self.0.lock().unwrap().capacity().get();',1],
                ['let cap = lock.capacity();','let cap = lock.capacity().get();',2],
                ['mod audio_state_tests;','mod audio_state_tests;\n#[cfg(all(test, not(target_os = "linux")))]\n#[path = "client/tests/audio_buffer_contract_tests.rs"]\nmod audio_buffer_contract_tests;',1]
              ]},
              'src/client/audio_playback.rs': {before:'656533c5e41a3f4c89f74540350a2b19fe0e2d51',after:'b722fffedae51fd4a4150e25ebd2a3312eb57bb3',edits:[
                ['use ringbuf::{ring_buffer::RbBase, Rb};','use ringbuf::traits::{Consumer, Observer};',1],
                ['let buffer_capacity = audio_buffer.lock().unwrap().capacity();','let buffer_capacity = audio_buffer.lock().unwrap().capacity().get();',1]
              ]},
              'src/client/audio_playback_tests.rs': {before:'bbe3e1646c1cb95e2b22abed02e5bc537e61fc92',after:'956f9c9650a21b8f7467fe92a06ae9265f764e17',edits:[
                ['use ringbuf::{ring_buffer::RbBase, Rb};','use ringbuf::traits::{Observer, Producer};',1]
              ]},
              'src/client/tests/audio_state_tests.rs': {before:'fa4c6efcceac4b06727b402c56fc4f5bbf40486d',after:'4464e7b9fdd1768847067bff429cfe9c6342e250',edits:[
                ['use ringbuf::Rb;','use ringbuf::traits::Consumer;',1]
              ]},
              'tools/windows_native.py': {before:'26d046ee81bccbff083ffab94d061453a87df919',after:'55c4264d20cba1c01580dc80ab98d068628fe31b',edits:[
                ["    report = {'arch': arch, 'rust_target': target, 'llvm': windows['llvm'], 'visual_studio': studio,", "    command([sys.executable, str(ROOT / 'tools/audio_tests.py')], 'windows-audio-tests.log')\n    report = {'arch': arch, 'rust_target': target, 'llvm': windows['llvm'], 'visual_studio': studio,",1]
              ]},
              '.github/workflows/apple-native.yml': {before:'eaf139b2ffca0f948a4948db156d7082109378cb',after:'e0d8d0228c0d28019e9b6645416682ca190c711f',edits:[
                ['      - name: Validate the shared packaging entry\n','      - name: Verify production audio buffering and callback contracts\n        run: python tools/audio_tests.py\n      - name: Validate the shared packaging entry\n',1]
              ]}
            };
            const result = {};
            for (const [file, edit] of Object.entries(edits)) {
              const source = await github.rest.repos.getContent({...context.repo, path:file, ref:'29e154ecb91e29d04a68bea81070aa93b46bcdfd'});
              if (source.data.sha !== edit.before || source.data.encoding !== 'base64') throw new Error('Baseline mismatch: '+file);
              let text = Buffer.from(source.data.content, 'base64').toString('utf8');
              for (const [before, after, count] of edit.edits) {
                if (text.split(before).length - 1 !== count) throw new Error('Ambiguous replacement: '+file);
                text = text.split(before).join(after);
              }
              const bytes = Buffer.from(text, 'utf8');
              const sha = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (sha !== edit.after) throw new Error('Reviewed source mismatch: '+file);
              const stored = await github.rest.git.createBlob({...context.repo, content:bytes.toString('base64'), encoding:'base64'});
              if (stored.data.sha !== sha) throw new Error('Object mismatch: '+file);
              result[file] = sha;
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'audio-code-objects.json'), JSON.stringify(result, null, 2)+'\n');
            core.info(JSON.stringify(result));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-code-objects
          path: ${{ runner.temp }}/audio-code-objects.json
          retention-days: 7
          if-no-files-found: error
