name: Audit remaining registry upgrades
on:
  push:
    branches: [codex/viper-completion-validation]
    paths: [.github/workflows/completion-dependency-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - run: python -m pip install -r tools/requirements-dev.txt
      - name: Query primary registries without upgrading dependencies
        run: |
          mkdir -p tools/.reports/dependency-audit
          git rev-parse HEAD > tools/.reports/dependency-audit/revision.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > tools/.reports/dependency-audit/queried-at.txt
          python tools/viper.py inventory --latest --output tools/.reports/dependency-audit/inventory.json
      - name: Require unchanged manifests and lockfiles
        if: always()
        run: git diff --exit-code HEAD -- Cargo.toml Cargo.lock flutter/pubspec.yaml flutter/pubspec.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: remaining-dependency-audit
          path: tools/.reports/dependency-audit/
          if-no-files-found: error
          retention-days: 7
