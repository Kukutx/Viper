name: Preserve reviewed iOS source and lockfile
on:
  push:
    branches: [codex/viper-ios-preparation]
permissions:
  contents: read
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: Kukutx/Viper
          run-id: 36772465280
          artifact-ids: 11123553853
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ios-source
          merge-multiple: true
      - name: Preserve reviewed blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ runner.temp }}/ios-source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          source=Path(os.environ['SOURCE'])/'ios-native-source.zip'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='196fcafa4196d32dd10386fc72b7264db8bb3deb2181a2929b17a9b2a1da4e84'
          entries=[]
          with zipfile.ZipFile(source) as z:
              assert len(z.namelist())==33 and len(set(z.namelist()))==33
              for item in z.infolist():
                  p=PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and item.file_size<500000
                  assert item.filename.startswith('flutter/ios/') or item.filename in ['res/vcpkg-triplets/arm64-ios.cmake','libs/scrap/build.rs','configs/toolchain.json','tools/verify_ios_bundle.py','Cargo.toml','Cargo.lock','src/lan.rs']
                  data=z.read(item);sha=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
                  req=urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
                  assert result['sha']==sha
                  entries.append({'path':item.filename,'mode':'100644','type':'blob','sha':sha})
          Path(os.environ['SOURCE'],'ios-objects.json').write_text(json.dumps(entries,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-ios-objects
          path: ${{ runner.temp }}/ios-source/ios-objects.json
          if-no-files-found: error
          retention-days: 3
