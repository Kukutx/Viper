name: Validate preserved PulseAudio fork migration
on:
  push:
    branches: [codex/viper-registry-upgrade-validation]
    paths: [.github/workflows/pulse-prepare.yml, .migration/pulse-helpers.json.gz, .migration/prepare-pulse.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/viper-registry-upgrade-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rustdesk-org/pulsectl
          ref: aa34dde499aa912a3abc5289cc0b547bd07dd6e2
          path: .pulse-upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Reconstruct only the reviewed fork migration
        run: |
          python .migration/prepare-pulse.py prepare
          python -m pip install -r tools/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libpulse-dev pulseaudio pulseaudio-utils pkg-config
      - name: Resolve the local fork without changing any other package
        run: python .migration/prepare-pulse.py resolve
      - name: Run source contracts and real isolated audio regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_pulse_vendor.py
          python tools/viper.py check
          python -m unittest discover -s tools/tests -v > tools/.reports/tools-tests.log 2>&1 || { cat tools/.reports/tools-tests.log; exit 1; }
          tail -8 tools/.reports/tools-tests.log
          bash -n tools/native/test-pulsectl.sh
          bash tools/native/test-pulsectl.sh
      - name: Export only validated source blobs, never move a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .migration/prepare-pulse.py export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-pulse-repair
          path: |
            tools/.reports/reviewed-source/
            tools/.reports/reviewed-blobs.json
            tools/.reports/tools-tests.log
            tools/.reports/pulse-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
