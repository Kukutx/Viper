name: Prepare and test reviewed authentication migration
on:
  push:
    branches: [codex/viper-auth-v6-preparation]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Apply only the reviewed migration to exact input blobs
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python .tools/auth-v6-prepare.py apply
          python tools/ci_rust.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: viper-auth-v6-preparation
      - name: Resolve the migrated lock once and require locked resolution afterwards
        run: |
          cargo metadata --format-version 1 > tools/.reports/auth-metadata.json
          cargo metadata --locked --format-version 1 > tools/.reports/auth-metadata.json
          python tools/viper.py check
          python -m unittest discover -s tools/tests -v > tools/.reports/auth-tools.log 2>&1 || { tail -100 tools/.reports/auth-tools.log; exit 1; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/viper-vcpkg
          key: auth-v6-yuv-${{ hashFiles('configs/toolchain.json', 'res/vcpkg/**') }}
      - name: Prepare native dependencies
        run: bash tools/native/setup-linux.sh
      - name: Execute production authentication regression tests
        run: |
          cargo test --locked --test auth_dependency_contract --features flutter,linux-pkg-config > tools/.reports/auth-dependencies.log 2>&1 || { tail -150 tools/.reports/auth-dependencies.log; exit 1; }
          tail -30 tools/.reports/auth-dependencies.log
          python .tools/auth-v6-prepare.py export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: auth-v6-preparation-diagnostics
          path: tools/.reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-v6-reviewed-sources
          path: .tools/auth-v6-reviewed/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  objects:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: auth-v6-reviewed-sources
          path: reviewed
      - name: Store validated Git blobs without changing any ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const data = JSON.parse(fs.readFileSync('reviewed/objects.json', 'utf8'));
            const allowed = ['Cargo.toml','Cargo.lock','src/auth_2fa.rs','src/server/connection.rs','.github/workflows/flutter-validate.yml','src/auth_2fa/totp.rs','tests/auth_dependency_contract.rs','tools/tests/test_auth_dependencies.py','docs/engineering/auth-dependencies-migration.md'];
            if (data.base !== 'e2ff7ab2ceef9f1602848d48c9202df58a71c385' || data.files.length !== allowed.length || new Set(data.files.map(x => x.path)).size !== allowed.length) throw new Error('Unexpected manifest');
            for (const item of data.files) {
              if (!allowed.includes(item.path)) throw new Error('Unexpected source path');
              const content = fs.readFileSync('reviewed/' + item.path);
              if (content.length !== item.size || crypto.createHash('sha256').update(content).digest('hex') !== item.sha256) throw new Error('Source checksum mismatch');
              const stored = await github.rest.git.createBlob({...context.repo, content: content.toString('base64'), encoding: 'base64'});
              if (stored.data.sha !== item.sha) throw new Error('Git blob mismatch');
            }
            fs.writeFileSync('stored-objects.json', JSON.stringify(data, null, 2));
            core.info(JSON.stringify(data));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-v6-stored-objects
          path: stored-objects.json
          if-no-files-found: error
          retention-days: 7
