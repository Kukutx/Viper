name: HTTP policy preparation
on:
  push:
    branches: [codex/viper-http-policy-validation]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a00d0fb450eadee4832eb538a3ab3a19b1ab6533
          submodules: recursive
          persist-credentials: false
      - name: Export the fixed source without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/http-inputs"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/http-inputs/source.tar.gz"
          git -C libs/hbb_common archive --format=tar.gz HEAD > "$RUNNER_TEMP/http-inputs/hbb-common.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/http-inputs/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/http-inputs/tree.txt"
          cd "$RUNNER_TEMP/http-inputs"
          sha256sum source.tar.gz hbb-common.tar.gz revision.txt tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: http-policy-source-${{ github.run_id }}
          path: ${{ runner.temp }}/http-inputs/
          if-no-files-found: error
          retention-days: 1
  common-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Store one preimage-checked source blob only
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const hash = b => crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');
            const before = '289925a0cb0c38a24f7c683ca31c212b877e8d81';
            const expected = 'e4c1837890db65a994708677bbdda99bb27e300b';
            const {data} = await github.rest.git.getBlob({...context.repo, file_sha: before});
            if (data.encoding !== 'base64') throw Error('Unexpected blob encoding');
            const bytes = Buffer.from(data.content, 'base64');
            if (hash(bytes) !== before) throw Error('Source preimage mismatch');
            let source = bytes.toString('utf8');
            const edits = [
              ['let client = create_http_client_async(tls_type, false);', 'let client = create_http_client_async(tls_type, false)?;', 2],
              ['        danger_accept_invalid_cert.unwrap_or(false),\n    )\n    .post(url);', '        danger_accept_invalid_cert.unwrap_or(false),\n    )?\n    .post(url);', 1],
              ['        danger_accept_invalid_cert.unwrap_or(false),\n    );\n    let normalized_method', '        danger_accept_invalid_cert.unwrap_or(false),\n    )?;\n    let normalized_method', 1]
            ];
            for (const [old, replacement, count] of edits) {
              if (source.split(old).length - 1 !== count) throw Error('Edit is not exact');
              source = source.split(old).join(replacement);
            }
            if (hash(Buffer.from(source)) !== expected) throw Error('Result does not match reviewed diff');
            const {data: blob} = await github.rest.git.createBlob({...context.repo, content: source, encoding: 'utf-8'});
            if (blob.sha !== expected) throw Error('Stored blob mismatch');
            fs.writeFileSync('objects.json', JSON.stringify([{path: 'src/common.rs', before, sha: blob.sha}], null, 2));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: http-policy-common-object-${{ github.run_id }}
          path: objects.json
          if-no-files-found: error
          retention-days: 1
