name: Verify F-Droid immutable SDK preparation
on:
  push:
    branches: [codex/viper-build-convergence-preparation]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Apply the reviewed entry-point replacement
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('flutter/build_fdroid.sh')
          data = path.read_bytes()
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == '7270e82dda46de227dd0cfb3100951be9492f4df'
          text = data.decode()
          start = text.index('# Install Flutter of version `VERSION`')
          end = text.index('# Start of script', start)
          replacement = '# Reuse the immutable SDK installer; preserve existing SDK worktrees.\nprepare_flutter() {\n\tbash "${ROOTDIR}/tools/native/prepare-fdroid-flutter.sh" "${1}" "${2}"\n}\n\n'
          path.write_text(text[:start] + replacement + text[end:])
          Path('tools/.reports').mkdir(exist_ok=True)
          PY
          python -m pip install -r tools/requirements-dev.txt
          python tools/viper.py check
          python -m unittest discover -s tools/tests -v > tools/.reports/tool-tests.log 2>&1 || { tail -120 tools/.reports/tool-tests.log; exit 1; }
          tail -12 tools/.reports/tool-tests.log
          bash -n tools/native/prepare-fdroid-flutter.sh flutter/build_fdroid.sh
          git diff --check
          git diff -- flutter/build_fdroid.sh > tools/.reports/fdroid.patch
      - name: Store the three reviewed file objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          entries = []
          for path in ('flutter/build_fdroid.sh', 'tools/native/prepare-fdroid-flutter.sh', 'tools/tests/test_fdroid_sdk.py'):
              data = Path(path).read_bytes()
              expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/Kukutx/Viper/git/blobs', method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode())
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == expected
              entries.append({'path': path, 'mode': '100755' if '/native/' in path else '100644', 'type': 'blob', 'sha': sha})
          Path('tools/.reports/objects.json').write_text(json.dumps({'base': '7d41615cce800082dd010888be83ed3d4b319643', 'entries': entries}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reviewed-fdroid-sdk
          path: tools/.reports/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
