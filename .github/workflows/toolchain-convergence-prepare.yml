name: Snapshot the exact build-migration baseline
on:
  push:
    branches: [codex/viper-build-convergence-preparation]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 693c0c36ada9270054bfe2a8d6c7e16bc4c2f085
          persist-credentials: false
      - run: |
          mkdir -p snapshot
          test "$(git rev-parse HEAD)" = 693c0c36ada9270054bfe2a8d6c7e16bc4c2f085
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          git ls-tree -r HEAD > snapshot/tree.txt
          sha256sum snapshot/source.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: viper-build-migration-baseline
          path: snapshot/
          retention-days: 3
          if-no-files-found: error
