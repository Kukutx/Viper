name: Snapshot completion baseline
on:
  push:
    branches: [codex/viper-completion-validation]
    paths: [.github/workflows/completion-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0653d8478f2b186b0d0965629b58907f99c2f85a
          submodules: recursive
          persist-credentials: false
      - name: Archive only tracked source at the explicit baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/completion-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/completion-source/source.tar.gz" HEAD
          git -C libs/hbb_common archive --format=tar.gz --output="$RUNNER_TEMP/completion-source/hbb_common.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/completion-source/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/completion-source/tree.txt"
          cd "$RUNNER_TEMP/completion-source"
          sha256sum source.tar.gz hbb_common.tar.gz tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: completion-baseline-0653d84
          path: ${{ runner.temp }}/completion-source/
          if-no-files-found: error
          retention-days: 3
