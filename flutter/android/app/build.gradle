import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
    id 'dev.flutter.flutter-gradle-plugin'
}

def androidTools = new JsonSlurper().parse(rootProject.file('../../configs/android-toolchain.json'))
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        workingDir rootProject.file('../..')
        commandLine 'cargo', 'metadata', '--locked', '--format-version', '1'
    }.standardOutput.asText.get()
    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == 'rustls-platform-verifier-android' }
    if (pkg == null) {
        throw new GradleException('rustls-platform-verifier-android package not found in locked cargo metadata')
    }
    def mavenDir = new File(file(pkg.manifest_path).parentFile, 'maven')
    if (!mavenDir.isDirectory()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    return mavenDir.path
}

repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${androidTools.protobuf_java}" }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { option 'lite' }
            }
        }
    }
}

android {
    namespace = 'com.carriez.flutter_hbb'
    compileSdk = androidTools.compile_sdk
    ndkVersion = androidTools.ndk
    buildToolsVersion = androidTools.build_tools
    sourceSets {
        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += 'message.proto'
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        targetCompatibility = JavaVersion.toVersion(androidTools.java_target)
        sourceCompatibility = JavaVersion.toVersion(androidTools.java_target)
    }
    defaultConfig {
        applicationId = 'com.carriez.flutter_hbb'
        minSdk = androidTools.min_sdk
        targetSdk = androidTools.target_sdk
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter { source = '../..' }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "com.google.protobuf:protobuf-javalite:${androidTools.protobuf_java}"
    implementation 'androidx.media:media:1.6.0'
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'rustls:rustls-platform-verifier:0.1.1'
}
