pluginManagement {
    def androidTools = new groovy.json.JsonSlurper().parse(file('../../configs/android-toolchain.json'))
    def flutterSdkPath = {
        def properties = new Properties()
        file('local.properties').withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        assert flutterSdkPath != null, 'flutter.sdk not set in local.properties'
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version androidTools.agp
        id 'com.android.library' version androidTools.agp
        id 'com.google.protobuf' version androidTools.protobuf_plugin
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' apply false
    id 'com.android.library' apply false
    id 'com.google.protobuf' apply false
}

include ':app'
