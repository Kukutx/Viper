pluginManagement {
    def toolchain = new groovy.json.JsonSlurper().parse(file("../../configs/toolchain.json")).android
    plugins {
        id "com.android.application" version toolchain.agp
        id "org.jetbrains.kotlin.android" version toolchain.kotlin
        id "com.google.protobuf" version toolchain.protobuf_plugin
    }
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" apply false
    id "org.jetbrains.kotlin.android" apply false
}

include ":app"
