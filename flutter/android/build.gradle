buildscript {
    def androidTools = new groovy.json.JsonSlurper().parse(file('../../configs/android-toolchain.json'))
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Supply the current compiler to AGP's built-in Kotlin without applying kotlin-android.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${androidTools.kotlin}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.layout.buildDirectory = file('../build')
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
    evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
